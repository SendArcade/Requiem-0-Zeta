name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_SOURCE: fixtures
      REDIS_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap cyclic workspace dependencies
        run: |
          pnpm --filter @beyoracle/shared --filter @beyoracle/db --filter @beyoracle/events --filter @beyoracle/jobs build
          pnpm --filter @beyoracle/catalog exec tsc
      - run: pnpm -r --workspace-concurrency=2 build
      - run: pnpm typecheck
      - run: pnpm -r --workspace-concurrency=2 test
      - run: pnpm ingest:fixtures
