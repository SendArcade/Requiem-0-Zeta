services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beyoracle
    ports:
      - "5432:5432"
    volumes:
      - beyoracle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/beyoracle
      REDIS_URL: redis://redis:6379
      MERCARI_API_ENABLED: ${MERCARI_API_ENABLED:-0}
      YAHOO_AUCTIONS_ENABLED: ${YAHOO_AUCTIONS_ENABLED:-0}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-900000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  beyoracle_pg:
