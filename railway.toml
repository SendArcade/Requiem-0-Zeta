# Beyoracle on Railway — monorepo deploy (repo root = build context)
#
# Per-service Dockerfile (set as service variables in Railway):
#   web:    RAILWAY_DOCKERFILE_PATH=apps/web/Dockerfile
#   worker: RAILWAY_DOCKERFILE_PATH=packages/worker/Dockerfile
#
# Deploy:
#   railway service link web && railway up --detach
#   railway service link worker && railway up --detach
#
# Service-specific overrides: railway.web.toml / railway.worker.toml

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
