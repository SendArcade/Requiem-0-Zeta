# Worker service config — set in Railway UI as custom config path: /railway.worker.toml
# Or set service variable: RAILWAY_DOCKERFILE_PATH=apps/worker/Dockerfile
#
# Cron ingest: worker boot removes Redis repeatable `scheduled-cron-tick` then re-adds
# it without a frozen tickId. BACKFILL_PAUSE_CRON_INGEST=1 actually pauses only because
# of that remove. Do not railway variable set from this change.
#
# Later product backfill (Burst-only identity recut):
#   See docs/PRODUCT_BACKFILL_FLEET.md
#   PRODUCT_BACKFILL_GENERATIONS=burst  (code default; use `all` for full catalog)
#   BULLMQ_LOCK_DURATION_MS=3600000 BULLMQ_LOCK_RENEW_MS=30000  (code defaults)
# Do NOT start a 64-shard PRODUCT_BACKFILL_FLEET from this change.
# Do not write venue yen as marks.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# numReplicas is set in Railway UI (scale horizontally for product.backfill.shard drain)
# Prefer railway.worker.json for replica count — config-as-code overrides dashboard per deploy.
