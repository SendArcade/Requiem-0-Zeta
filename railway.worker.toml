# Worker service config — set in Railway UI as custom config path: /railway.worker.toml
# Or set service variable: RAILWAY_DOCKERFILE_PATH=packages/worker/Dockerfile
#
# Full-catalog parallel product backfill fleet:
#   See docs/PRODUCT_BACKFILL_FLEET.md
#   1) Set PRODUCT_BACKFILL_ENQUEUE=1 PRODUCT_BACKFILL_FLEET=1 PRODUCT_BACKFILL_SHARD_COUNT=64
#   2) Scale this service to many replicas (16–64+)
#   3) After queue drains: PRODUCT_BACKFILL_ENQUEUE=0 PRODUCT_BACKFILL_FLEET=0

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# numReplicas is set in Railway UI (scale horizontally for product.backfill.shard drain)
